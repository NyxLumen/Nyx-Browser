<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    [{[ if .ReCaptcha -]}]
    <script src="[{[ .ReCaptchaHost ]}]/recaptcha/api.js?render=explicit"></script>
    [{[ end ]}]

    <title>
      [{[ if .Name -]}][{[ .Name ]}][{[ else ]}]Nyx Browser[{[ end ]}]
    </title>

    <meta name="robots" content="noindex,nofollow" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="[{[ .StaticURL ]}]/img/icons/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="[{[ .StaticURL ]}]/img/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="[{[ .StaticURL ]}]/img/icons/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="[{[ .StaticURL ]}]/img/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="[{[ .StaticURL ]}]/img/icons/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="[{[ .StaticURL ]}]/img/icons/safari-pinned-tab.svg"
      color="#E5252A"
    />
    <meta name="apple-mobile-web-app-title" content="Nyx Browser" />
    <meta name="application-name" content="nyxbrowser" />
    <meta name="msapplication-TileColor" content="#0A0A0A" />
    <meta
      name="msapplication-TileImage"
      content="[{[ .StaticURL ]}]/img/icons/mstile-150x150.png"
    />
    <meta
      name="msapplication-config"
      content="[{[ .StaticURL ]}]/browserconfig.xml"
    />

    <!-- Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nyxbrowser" />
    <meta
      property="og:title"
      content="[{[ if .Name -]}][{[ .Name ]}][{[ else ]}]Nyx Browser[{[ end ]}]"
    />
    <meta
      property="og:image"
      content="[{[ .StaticURL ]}]/img/icons/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="[{[ if .Name -]}][{[ .Name ]}][{[ else ]}]Nyx Browser[{[ end ]}]"
    />
    <meta
      name="twitter:image"
      content="[{[ .StaticURL ]}]/img/icons/og-image.png"
    />

    <!-- Add to home screen for Android and modern mobile browsers -->
    <link
      rel="manifest"
      id="manifestPlaceholder"
      crossorigin="use-credentials"
    />
    <meta
      name="theme-color"
      content="[{[ if .Color -]}][{[ .Color ]}][{[ else ]}]#0A0A0A[{[ end ]}]"
    />

    <!-- Inject Some Variables and generate the manifest json -->
    <script>
      // We can assign JSON directly
      window.Nyx = [{[ .Json ]}];
      window.FileBrowser = window.Nyx;
      // Global function to prepend static url
      window.__prependStaticUrl = (url) => {
        return `${window.Nyx.StaticURL}/${url.replace(/^\/+/, "")}`;
      };
      var dynamicManifest = {
        name: window.Nyx.Name || "Nyx Browser",
        short_name: "nyxbrowser",
        icons: [
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/icon-192.png"),
            sizes: "192x192",
            type: "image/png",
            purpose: "any",
          },
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/icon-512.png"),
            sizes: "512x512",
            type: "image/png",
            purpose: "any",
          },
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/icon-maskable-512.png"),
            sizes: "512x512",
            type: "image/png",
            purpose: "maskable",
          },
        ],
        start_url: window.location.origin + window.Nyx.BaseURL,
        display: "standalone",
        background_color: "#0A0A0A",
        theme_color: window.Nyx.Color || "#0A0A0A",
      };

      const stringManifest = JSON.stringify(dynamicManifest);
      const blob = new Blob([stringManifest], { type: "application/json" });
      const manifestURL = URL.createObjectURL(blob);
      document
        .querySelector("#manifestPlaceholder")
        .setAttribute("href", manifestURL);
    </script>

    <style>
      html, body {
        background-color: #0A0A0A;
        color: #F2F0EA;
      }

      #loading {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #0A0A0A;
        z-index: 9999;
        transition: 0.1s ease opacity;
        -webkit-transition: 0.1s ease opacity;
      }

      #loading.done {
        opacity: 0;
      }

      #loading .spinner {
        width: 70px;
        text-align: center;
        position: fixed;
        top: 50%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      #loading .spinner > div {
        width: 14px;
        height: 14px;
        background-color: #d71921;
        border-radius: 100%;
        display: inline-block;
        -webkit-animation: sk-bouncedelay 1.4s infinite ease-in-out both;
        animation: sk-bouncedelay 1.4s infinite ease-in-out both;
      }

      #loading .spinner .bounce1 {
        -webkit-animation-delay: -0.32s;
        animation-delay: -0.32s;
      }

      #loading .spinner .bounce2 {
        -webkit-animation-delay: -0.16s;
        animation-delay: -0.16s;
      }

      @-webkit-keyframes sk-bouncedelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
        }
      }

      @keyframes sk-bouncedelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
          transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>

    [{[ if .CSS -]}]
    <link rel="stylesheet" href="[{[ .StaticURL ]}]/custom.css" />
    [{[ end ]}]
  </body>
</html>
