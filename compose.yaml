services:
  nyx:
    container_name: nyx
    image: nyxlumen/nyx-browser:latest
    networks:
      - nyx
    ports:
      - 8000:80
    volumes:
      - nyx:/flux/vault
    environment:
      - NYX_REDIS_CACHE_URL=redis://default:nyx@redis:6379 # Use rediss:// for ssl
      # Legacy fallback supported:
      # - FB_REDIS_CACHE_URL=redis://default:nyx@redis:6379

  redis:
    container_name: redis
    image: redis:latest
    networks:
      - nyx
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >nyx ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl

networks:
  nyx:

volumes:
  nyx:
